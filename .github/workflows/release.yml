# Releases the mod: every push to release reads the version from its meitou.json and, unless the tag <slug>-v<version> exists,
# creates that tag at the release head and publishes <MOD_FOLDER>-<version>.zip (with its SHA-256) holding the folder to drop into
# Kenshi/mods/, all in one run. A hand-pushed tag (tools/Tag-Release.ps1) does the same as a fallback. Packaging: GutenStructure
# package-meitou-mod.yml (pinned).
name: Release

on:
  push:
    branches: [release]
    tags: ["way-of-the-fist-v*"]

permissions:
  contents: read

jobs:
  release-gate:
    permissions:
      contents: read
    uses: TheIvoryDisaster/GutenStructure/.github/workflows/release-gate.yml@29fefc59172e5427e6bbf7ef5ba1741f7fe64daa

  release:
    needs: release-gate
    permissions:
      contents: write
    uses: TheIvoryDisaster/GutenStructure/.github/workflows/package-meitou-mod.yml@29fefc59172e5427e6bbf7ef5ba1741f7fe64daa
    with:
      mod-folder: WayOfTheFist
      slug: way-of-the-fist
      channel: release
      test-project: .
      # true for a code mod without data: the zip gets an empty WayOfTheFist.mod. false when <Mod>.Data generates one.
      empty-data-mod: true

name: CI
'on':
  workflow_dispatch: null
  pull_request:
    branches:
    - beta
    - main
    - release
  push:
    branches:
    - beta
    - main
    - release
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    uses: TheIvoryDisaster/GutenStructure/.github/workflows/build-dotnet.yml@29fefc59172e5427e6bbf7ef5ba1741f7fe64daa
  play:
    name: Play deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        submodules: recursive
        persist-credentials: false
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
      with:
        dotnet-version: 11.0.x
    - name: Build Play into a stand-in mods folder and check what it deployed
      run: "shopt -s nullglob # a repo with no mod yet (a library) deploys nothing\nmods=\"$RUNNER_TEMP/mods\"\nmkdir -p \"\
        $mods\"\ndotnet build Play/Play.csproj -p:KenshiModsDir=\"$mods/\"\nfor mod in */meitou.json; do\n  name=$(dirname\
        \ \"$mod\")\n  files=\"$name.dll $name.pdb meitou.json\"\n  # A generated .mod needs the installed game, which CI\
        \ lacks; a mod without a generator gets an empty one.\n  test -f \"$name.Data/$name.Data.csproj\" || files=\"$files\
        \ $name.mod\"\n  for file in $files; do\n    test -f \"$mods/$name/$file\" || { echo \"missing $mods/$name/$file\"\
        ; ls -R \"$mods\"; exit 1; }\n  done\ndone\n# Each locked framework's release folder is deployed beside the mods.\n\
        for name in $(python3 -c 'import json; print(\" \".join(f[\"folder\"] for f in json.load(open(\"meitou.lock.json\"\
        ))[\"frameworks\"]))'); do\n  for file in \"$name.dll\" meitou.json; do\n    test -f \"$mods/$name/$file\" || { echo\
        \ \"missing $mods/$name/$file\"; ls -R \"$mods\"; exit 1; }\n  done\ndone\n"
  engine-references:
    name: Engine references
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        submodules: recursive
        persist-credentials: false
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
      with:
        dotnet-version: 11.0.x
    - name: Check engine references against the newest Meitou release
      run: tools/refcheck.sh
  development-readiness:
    name: Development readiness
    if: always()
    needs:
    - build
    - play
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Require prerequisite checks
      env:
        RESULTS: ${{ toJSON(needs) }}
        TARGET: ${{ github.base_ref || github.ref_name }}
      run: "python - <<'PYCODE'\nimport json, os\nresults = json.loads(os.environ['RESULTS'])\nrequired = list(results)\n\
        if not required or any(results[key]['result'] != 'success' for key in required):\n    raise SystemExit('A prerequisite\
        \ failed, was cancelled, or was skipped')\nPYCODE\n"
  upstream-compatibility:
    uses: TheIvoryDisaster/GutenStructure/.github/workflows/upstream-compatibility.yml@29fefc59172e5427e6bbf7ef5ba1741f7fe64daa
  package-validation:
    uses: TheIvoryDisaster/GutenStructure/.github/workflows/package-validation.yml@29fefc59172e5427e6bbf7ef5ba1741f7fe64daa
    with:
      mod-folder: WayOfTheFist
      empty-data-mod: true
  release-readiness:
    name: Release readiness
    if: always()
    needs:
    - development-readiness
    - upstream-compatibility
    - package-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Require prerequisite checks
      env:
        RESULTS: ${{ toJSON(needs) }}
        TARGET: ${{ github.base_ref || github.ref_name }}
      run: "python - <<'PYCODE'\nimport json, os\nresults = json.loads(os.environ['RESULTS'])\ntarget = os.environ['TARGET']\n\
        required = list(results) if target == 'release' else ['development-readiness']\nif not required or any(results[key]['result']\
        \ != 'success' for key in required):\n    raise SystemExit('A prerequisite failed, was cancelled, or was skipped')\n\
        PYCODE\n"
